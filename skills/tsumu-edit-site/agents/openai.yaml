interface:
  display_name: "Edit a Tsumu Site"
  short_description: "Edit pages and elements in a connected Tsumu site"
  default_prompt: "Use $tsumu-edit-site to edit the existing paired Tsumu website and verify saved changes."
dependencies:
  tools:
    - type: "mcp"
      value: "tsumu"
      description: "Tsumu MCP server for website creation and editing"
      transport: "streamable_http"
      url: "https://mcp.tsumu.ebii.net/mcp"
policy:
  allow_implicit_invocation: true
