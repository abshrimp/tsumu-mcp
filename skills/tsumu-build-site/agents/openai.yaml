interface:
  display_name: "Build a Tsumu Site"
  short_description: "Create editable websites with a private import link"
  default_prompt: "Use $tsumu-build-site to create a new editable Tsumu website and provide the import link."
dependencies:
  tools:
    - type: "mcp"
      value: "tsumu"
      description: "Tsumu MCP server for website creation and editing"
      transport: "streamable_http"
      url: "https://mcp.tsumu.ebii.net/mcp"
policy:
  allow_implicit_invocation: true
